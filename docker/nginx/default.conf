# nginxはPHPを実行できないため、.phpへのリクエストはappコンテナ(php-fpm、
# 9000番ポート)へfastcgiで転送する。静的ファイル(CSS/JS/画像)はnginxが
# 直接返す。

server {
    listen 80;
    server_name _;

    root /var/www/html/webroot;
    index index.php;

    # CakePHPのURL(/members/edit/1 のような、実ファイルが無いパス)を
    # index.phpに振り分ける
    location / {
        try_files $uri $uri/ /index.php?$args;
    }

    location ~ \.php$ {
        fastcgi_pass app:9000;
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        include fastcgi_params;
    }

    # .env等の隠しファイルへの直接アクセスを禁止
    location ~ /\.(?!well-known) {
        deny all;
    }
}
