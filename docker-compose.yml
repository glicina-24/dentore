# nginx(Webサーバー) / app(php-fpm) / cron(定期実行) / mysql(DB) の
# 4コンテナ構成。「1コンテナ1プロセス」の原則を保つため、
# Webサーバーとcronを別コンテナに分けている。

services:
  nginx:
    image: nginx:1.27-alpine
    container_name: dentore-nginx
    restart: unless-stopped
    ports:
      - "8081:80"
    volumes:
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      # webrootはappコンテナと同じ内容を見る必要があるため、ホスト上の
      # webroot/ディレクトリをapp・nginx双方にマウントして共有する。
      - ./webroot:/var/www/html/webroot:ro
    depends_on:
      - app

  app:
    build: .
    container_name: dentore-app
    restart: unless-stopped
    volumes:
      - ./webroot:/var/www/html/webroot
    env_file:
      - .env
    depends_on:
      - mysql

  cron:
    build: .
    container_name: dentore-cron
    restart: unless-stopped
    # /etc/cron.d/daily-notify(Dockerfileでコピー済み)を読み込んでcronを
    # フォアグラウンド実行する。「1コンテナ1プロセス」を保つための専用コンテナ。
    command: cron -f
    env_file:
      - .env
    depends_on:
      - mysql

  mysql:
    image: mysql:8.0
    container_name: dentore-mysql
    restart: unless-stopped
    environment:
      - MYSQL_DATABASE=${DB_DATABASE}
      - MYSQL_USER=${DB_USERNAME}
      - MYSQL_PASSWORD=${DB_PASSWORD}
      - MYSQL_ROOT_PASSWORD=${MYSQL_ROOT_PASSWORD}
    volumes:
      # 名前付きボリュームで永続化(bind mountだとホスト/コンテナ間の
      # UID不一致でMySQLの起動に失敗することがあるため)
      - mysql-data:/var/lib/mysql

volumes:
  mysql-data:
